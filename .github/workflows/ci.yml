name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts data

      - name: Test
        run: pytest -q

      - name: Smoke run
        run: |
          corridor-sim --preset dlr2_der4_bess --start 2024-06-01 --days 1 --out runs
          python scripts/run_matrix.py --only static_der4 dlr2_der4 --days 1 --jobs 2
